name: Bug report
description: Something behaves differently than documented.
labels: ['bug']
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened, and what did you expect instead?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Command, persona, and config used. Redact secrets and do not attach `.cohort/runs` or traces.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: cohort version
      placeholder: 0.1.0-rc.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Node version and OS
      placeholder: Node 24.2.0, Linux
    validations:
      required: true
