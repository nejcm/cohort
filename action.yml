name: cohort.
description: Run synthetic-user journeys with the lab CLI from the same release as this Action.
author: cohort. contributors

inputs:
  persona:
    description: Persona ID to run (choose one of persona, tag, suite, or url with note).
    required: false
  tag:
    description: Run every persona with this tag.
    required: false
  suite:
    description: Suite ID to run.
    required: false
  url:
    description: Start URL. Never put bearer tokens here; use setup bindings.
    required: false
  note:
    description: Ad-hoc goal or note.
    required: false
  compare-run:
    description: Approved run ID to replay on base-url and head-url with cohort compare instead of cohort run.
    required: false
  base-url:
    description: Base deployment origin for compare-run, for example the production or main-branch preview.
    required: false
  head-url:
    description: Head deployment origin for compare-run, for example the pull request preview.
    required: false
  model:
    description: Optional <provider>/<id> override, same precedence as cohort run --model.
    required: false
  effort:
    description: Optional low|medium|high override.
    required: false
  repeats:
    description: Optional repetitions per entry.
    required: false
  allow-untested:
    description: Set to "true" to allow untested catalog entries.
    required: false
    default: 'false'
  max-usd:
    description: Optional dollar ceiling for the batch estimate (cohort run --max-usd; default 10).
    required: false
  allow-unpriced:
    description: Set to "true" to run models with unknown prices, which the dollar ceiling cannot cap.
    required: false
    default: 'false'
  working-directory:
    description: Project directory that contains .cohort/.
    required: false
    default: '.'
  install-browser:
    description: Set to "false" to skip installing Chromium and its system dependencies.
    required: false
    default: 'true'
  package:
    description: npm package spec to install instead of this release (for testing a release candidate tarball).
    required: false
    default: ''

outputs:
  batch-id:
    description: Batch ID, empty when no batch started.
    value: ${{ steps.run.outputs.batch-id }}
  report-path:
    description: Path of the batch report.html.
    value: ${{ steps.run.outputs.report-path }}
  exit-code:
    description: run 0 all completed, 1 any other outcome; compare 1 confirmed regression, else 0; 2 invalid configuration.
    value: ${{ steps.run.outputs.exit-code }}
  runs:
    description: Number of runs that started.
    value: ${{ steps.run.outputs.runs }}
  completed:
    description: Runs that completed.
    value: ${{ steps.run.outputs.completed }}
  abandoned:
    description: Runs the agent abandoned.
    value: ${{ steps.run.outputs.abandoned }}
  blocked:
    description: Runs that ended blocked.
    value: ${{ steps.run.outputs.blocked }}
  agent-error:
    description: Runs that ended as agent or harness errors, including interruptions.
    value: ${{ steps.run.outputs.agent-error }}
  limit-reached:
    description: Runs that hit a step, time, or cost limit.
    value: ${{ steps.run.outputs.limit-reached }}
  outcome:
    description: compare-run result, unchanged, fixed, regression, or inconclusive; empty otherwise.
    value: ${{ steps.run.outputs.outcome }}
  markdown-path:
    description: Path of the compare PR-comment body; empty when compare did not finish.
    value: ${{ steps.run.outputs.markdown-path }}

runs:
  using: composite
  steps:
    - name: Install the lab CLI
      shell: bash
      env:
        COHORT_PREFIX: ${{ runner.temp }}/cohort-lab
        COHORT_PACKAGE: ${{ inputs.package }}
      run: |
        spec="${COHORT_PACKAGE:-cohort-lab@$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').version")}"
        npm install --prefix "$COHORT_PREFIX" --no-save --no-audit --no-fund "$spec"
        echo "$COHORT_PREFIX/node_modules/.bin" >> "$GITHUB_PATH"
    - name: Install Chromium
      if: inputs.install-browser == 'true'
      shell: bash
      run: playwright install --with-deps chromium
    - name: Run cohort
      id: run
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        INPUT_PERSONA: ${{ inputs.persona }}
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_SUITE: ${{ inputs.suite }}
        INPUT_URL: ${{ inputs.url }}
        INPUT_NOTE: ${{ inputs.note }}
        INPUT_MODEL: ${{ inputs.model }}
        INPUT_EFFORT: ${{ inputs.effort }}
        INPUT_REPEATS: ${{ inputs.repeats }}
        INPUT_ALLOW_UNTESTED: ${{ inputs.allow-untested }}
        INPUT_MAX_USD: ${{ inputs.max-usd }}
        INPUT_ALLOW_UNPRICED: ${{ inputs.allow-unpriced }}
        INPUT_COMPARE_RUN: ${{ inputs.compare-run }}
        INPUT_BASE_URL: ${{ inputs.base-url }}
        INPUT_HEAD_URL: ${{ inputs.head-url }}
      run: node "$GITHUB_ACTION_PATH/action/run.ts"
